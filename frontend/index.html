<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-atr-bpn.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pantau.Kantah Tangsel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Fallback & Initial Loading Styles */
      :root, [data-theme="light"] {
        --app-bg: #F8FAFC;
        --app-card: #FFFFFF;
        --app-text: #0F172A;
        --app-muted: #64748B;
        --app-border: #E2E8F0;
        --app-primary: #1D4ED8;
      }
      [data-theme="dark"] {
        --app-bg: #07182D;
        --app-card: #0B2545;
        --app-text: #F8FAFC;
        --app-muted: #94A3B8;
        --app-border: #1E3A8A;
        --app-primary: #3B82F6;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--app-bg);
      }
      .app-initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background-color: var(--app-bg);
        color: var(--app-muted);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .app-spinner {
        width: 34px;
        height: 34px;
        border: 3.5px solid rgba(29, 78, 216, 0.15);
        border-top-color: var(--app-primary);
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script src="/recovery.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader">
        <img src="/logo-atr-bpn.png" alt="Logo ATR/BPN" style="width: 48px; height: 48px; object-fit: contain;" />
        <div class="app-spinner"></div>
        <div style="font-size: 0.85rem; font-weight: 500;">Memuat Pantau Kantah Tangsel...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
