services:
  pantau-sp:
    build: .
    container_name: pantau-sp-app
    restart: always
    ports:
      - "3001:3001"
      - "3002:3002"
    volumes:
      # PENTING: Me-mapping database.sqlite dan uploads dari dalam container ke luar (host QNAP)
      # agar data tidak hilang ketika container di-restart atau di-update!
      - ./backend/database.sqlite:/app/backend/database.sqlite
      - ./backend/uploads:/app/backend/uploads
      - ./backend/server.js:/app/backend/server.js
      - ./backend/validation.js:/app/backend/validation.js
      - ./backend/src:/app/backend/src
      - ./backend/scripts:/app/backend/scripts
      - ./backups:/app/backups
      - ./backend/cert.pem:/app/backend/cert.pem
      - ./backend/key.pem:/app/backend/key.pem
      - ./frontend/dist:/app/frontend/dist
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pantau-sp-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${CF_TOKEN_PART1:-eyJhIjoiNTE0YjlhMWEwMTA4YzhhNWY1NGI3NGRjMDYyNThhMjUiLCJ0IjoiZjc2MjdkMzYtYzI0Yi00NWRmLWIxNTAtMGY5NjZmZDc2MzE4IiwicyI6}${CF_TOKEN_PART2:-Ik9EVTJPRGt3WVRFdFpUTTRaUzAwTkdVM0xXRTJOVGt0TTJFeVptVXhaamt6TkdWaCJ9}
    depends_on:
      - pantau-sp
